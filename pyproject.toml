[project]
name = "ai-market-intelligence"
version = "0.1.0"
description = "AI Market intelligence Platform Service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "asyncio>=4.0.0",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.138.0",
    "langchain>=1.3.11",
    "langchain-google-genai>=4.2.7",
    "langgraph>=1.2.6",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "serpapi>=1.0.2",
    "tavily-python>=0.7.26",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
indent-style = "tab"
docstring-code-format = true

[dependency-groups]
dev = ["ruff>=0.15.22"]
